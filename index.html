<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense & Budget Visualizer</h1>
      <div class="balance-card">
        <p>TOTAL BALANCE</p>
        <h2 id="total-balance">$0.00</h2>
      </div>
    </header>

    <main class="main-content">
      <!-- Form Input -->
      <section class="card form-section">
        <h3>Add Transaction</h3>
        <form id="transaction-form">
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input type="text" id="item-name" placeholder="e.g. Cilok" required>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" step="0.01" placeholder="14.94" required>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">Add Transaction</button>
        </form>
      </section>

      <!-- Grid untuk List & Chart -->
      <div class="dashboard-grid">
        <!-- List Transaksi -->
        <section class="card list-section">
          <h3>Transactions</h3>
          <div class="scrollable-list">
            <ul id="transaction-list"></ul>
          </div>
        </section>

        <!-- Chart -->
        <section class="card chart-section">
          <h3>Spending by Category</h3>
          <div class="chart-container">
            <canvas id="spendingChart"></canvas>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
